version: 2
project_name: couchcade
before:
  hooks:
    - go mod tidy
builds:
  - id: couchcade
    main: ./cmd/couchcade
    binary: couchcade
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
dockers:
  - image_templates: ["ghcr.io/arthur031221/couchcade:{{ .Version }}", "ghcr.io/arthur031221/couchcade:latest"]
    dockerfile: Dockerfile.release
    use: docker
brews:
  - repository:
      owner: Arthur031221
      name: homebrew-tap
    homepage: https://github.com/Arthur031221/Couchcade
    description: Party games for one TV and everyone's phones
    license: MIT
